<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top text path: semi-circle for arching text -->
    <path id="textPathTop" d="M 64,256 A 192,192 0 0,1 448,256" fill="none" />
    
    <!-- Bottom text path: semi-circle for bottom arching text -->
    <path id="textPathBottom" d="M 416,256 A 160,160 0 0,1 96,256" fill="none" />

    <!-- Ribbon gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Green ribbon gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <!-- Gold gradient for accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Background (Light Yellow/Cream) -->
  <circle cx="256" cy="256" r="240" fill="#fefef0" stroke="#1e3a8a" stroke-width="6" />
  
  <!-- Outer Ring Inner Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#eab308" stroke-width="2" />

  <!-- Inner Circle Background (Cream/White) -->
  <circle cx="256" cy="256" r="176" fill="#fffdf5" stroke="#1e3a8a" stroke-width="4" />

  <!-- Knowledge, Wisdom, Understanding curved text -->
  <text font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="21px" fill="#1e3a8a" letter-spacing="4px">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      KNOWLEDGE ★ WISDOM ★ UNDERSTANDING
    </textPath>
  </text>

  <!-- Group with drop shadow for the core emblem features -->
  <g filter="url(#dropShadow)">
    
    <!-- Stylized Human Figures (Red) -->
    <!-- Left Figure -->
    <g id="left-figure">
      <!-- Head -->
      <circle cx="210" cy="225" r="20" fill="#dc2626" />
      <!-- Body with raised arm -->
      <path d="M 210,250 
               C 170,230 140,200 132,190 
               C 125,180 135,175 142,185 
               C 155,200 185,225 210,245
               C 215,255 220,290 220,330
               L 196,330 
               C 196,290 198,270 210,250 Z" 
            fill="#dc2626" />
    </g>

    <!-- Right Figure -->
    <g id="right-figure">
      <!-- Head -->
      <circle cx="302" cy="225" r="20" fill="#dc2626" />
      <!-- Body with raised arm -->
      <path d="M 302,250 
               C 342,230 372,200 380,190 
               C 387,180 377,175 370,185 
               C 357,200 327,225 302,245
               C 297,255 292,290 292,330
               L 316,330 
               C 316,290 314,270 302,250 Z" 
            fill="#dc2626" />
    </g>

    <!-- Central Majestic Book -->
    <g id="open-book" transform="translate(186, 75)">
      <!-- Book Back Cover / Shadow -->
      <path d="M 3,68 C 25,58 48,58 70,68 L 70,12 C 48,2 25,2 3,12 Z" fill="#78350f" />
      <path d="M 137,68 C 115,58 92,58 70,68 L 70,12 C 92,2 115,2 137,12 Z" fill="#78350f" />
      
      <!-- Pages -->
      <path d="M 5,64 C 25,54 48,54 70,64 L 70,8 C 48,-2 25,-2 5,8 Z" fill="#fef08a" stroke="#451a03" stroke-width="1.5" />
      <path d="M 135,64 C 115,54 92,54 70,64 L 70,8 C 92,-2 115,-2 135,8 Z" fill="#fef08a" stroke="#451a03" stroke-width="1.5" />
      
      <!-- Inside Page lines to show a real book -->
      <path d="M 12,20 Q 35,12 60,20 M 12,32 Q 35,24 60,32 M 12,44 Q 35,36 60,44" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="2,2" />
      <path d="M 128,20 Q 105,12 80,20 M 128,32 Q 105,24 80,32 M 128,44 Q 105,36 80,44" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="2,2" />
    </g>

    <!-- Blue Scroll Ribbon Banner for "St. Antony's School" -->
    <g id="blue-ribbon">
      <!-- Ribbon Left Fold -->
      <path d="M 76,380 L 106,340 L 106,390 Z" fill="#1d4ed8" />
      <path d="M 76,380 L 106,390 L 136,365 L 136,315 Z" fill="#1e40af" stroke="#fbbf24" stroke-width="1.5" />
      
      <!-- Ribbon Right Fold -->
      <path d="M 436,380 L 406,340 L 406,390 Z" fill="#1d4ed8" />
      <path d="M 436,380 L 406,390 L 376,365 L 376,315 Z" fill="#1e40af" stroke="#fbbf24" stroke-width="1.5" />

      <!-- Main Banner Plate -->
      <path d="M 116,355 
               C 186,325 326,325 396,355 
               L 386,400 
               C 316,370 196,370 126,400 Z" 
            fill="url(#ribbonGrad)" stroke="#fbbf24" stroke-width="2" />
            
      <!-- Banner Text "St. Antony's School" -->
      <!-- We can place it nicely along a path, or use a centered text with rotation -->
      <text x="256" y="367" 
            font-family="'Georgia', 'Times New Roman', serif" 
            font-weight="900" 
            font-size="20px" 
            fill="#ffffff" 
            text-anchor="middle"
            letter-spacing="1px"
            style="text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);">
        St. Antony's School
      </text>
    </g>

    <!-- Green Scroll Ribbon Banner for "Porumamilla" -->
    <g id="green-ribbon">
      <!-- Green Banner Plate -->
      <path d="M 166,410 
               C 206,395 306,395 346,410 
               L 338,440 
               C 298,425 214,425 174,440 Z" 
            fill="url(#greenGrad)" stroke="#fbbf24" stroke-width="1.5" />

      <!-- Green Banner Text "Porumamilla" -->
      <text x="256" y="428" 
            font-family="'Inter', sans-serif" 
            font-weight="800" 
            font-size="12px" 
            fill="#ffffff" 
            text-anchor="middle"
            letter-spacing="2px">
        PORUMAMILLA
      </text>
    </g>
  </g>

  <!-- ESTD - 2000 arching text along the bottom -->
  <text font-family="'Georgia', serif" font-weight="bold" font-size="16px" fill="#1e3a8a" letter-spacing="2px">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ESTD - 2000
    </textPath>
  </text>
</svg>
