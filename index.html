    <!-- AI Studio Sandbox Error & Storage Resiliency -->
    <script>
      (function() {
        // Safe global error suppression for sandboxed iframes (ResizeObserver, getter restrictions)
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) || '';
          if (
            msg.indexOf('ResizeObserver') !== -1 ||
            msg.indexOf('loop limit exceeded') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('which has only a getter') !== -1 ||
            msg.indexOf('Illegal invocation') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) || '';
          var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
          if (
            msg.indexOf('ResizeObserver') !== -1 ||
            msg.indexOf('loop limit exceeded') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('which has only a getter') !== -1 ||
            msg.indexOf('Illegal invocation') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <!-- Preconnect to Font Servers for optimal loading speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
