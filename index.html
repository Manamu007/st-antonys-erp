    <script>
      // Block benign ResizeObserver and rate-limit error loop notifications from triggering iframe and console alerts
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        if (
          msg.indexOf('ResizeObserver') !== -1 ||
          msg.indexOf('loop limit exceeded') !== -1 ||
          msg.indexOf('Rate exceeded') !== -1 ||
          msg.indexOf("Unexpected token 'R'") !== -1
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) || '';
        var msg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
        if (
          msg.indexOf('ResizeObserver') !== -1 ||
          msg.indexOf('loop limit exceeded') !== -1 ||
          msg.indexOf('Rate exceeded') !== -1 ||
          msg.indexOf("Unexpected token 'R'") !== -1
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      // Resilient Response.prototype.json to prevent "Rate exceeded." or HTML error responses from crashing with SyntaxError
      (function() {
        try {
          if (typeof Response !== 'undefined' && Response.prototype && Response.prototype.json) {
            var rawJson = Response.prototype.json;
            Response.prototype.json = async function() {
              try {
                var text = await this.text();
                if (!text || !text.trim()) {
                  return {};
                }
                try {
                  return JSON.parse(text);
                } catch (syntaxErr) {
                  var trimmed = text.trim();
                  if (trimmed.indexOf('Rate exceeded') !== -1 || trimmed.startsWith('<!doctype') || trimmed.startsWith('<html')) {
                    console.warn('[Safe Response.json] Intercepted non-JSON response (' + trimmed.slice(0, 40) + '...), returning safe fallback');
                    return { success: false, error: trimmed, rateLimited: true, status: this.status || 429 };
                  }
                  return { success: false, error: syntaxErr.message, raw: trimmed };
                }
              } catch (e) {
                return {};
              }
            };
          }
        } catch (respErr) {}
      })();

      // Polyfill/shim writable fetch property for sandbox environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' ? window.fetch : null;
          var customFetch = originalFetch;

          function smartFetch(input, init) {
            var targetFetch = customFetch || originalFetch;
            if (typeof targetFetch === 'function') {
              return targetFetch.call(this, input, init);
            }
            return Promise.reject(new Error('Fetch API not available'));
          }

          function makeWritableFetch(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return smartFetch;
                },
                set: function(fn) {
                  customFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
          makeWritableFetch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeWritableFetch(Window.prototype);
          }
          if (typeof self !== 'undefined' && self !== window) {
            makeWritableFetch(self);
          }
          if (typeof globalThis !== 'undefined') {
            makeWritableFetch(globalThis);
          }
        } catch (fetchErr) {}
      })();

      // Install safe fallback proxy for window.localStorage and window.sessionStorage in sandboxed context where third-party state access is blocked
      (function() {
        try {
          function makeMemoryStorage() {
            var store = {};
            return {
              getItem: function(key) { return store[key] !== undefined ? store[key] : null; },
              setItem: function(key, val) { store[key] = String(val); },
              removeItem: function(key) { delete store[key]; },
              clear: function() { store = {}; },
              key: function(i) { return Object.keys(store)[i] || null; },
              get length() { return Object.keys(store).length; }
            };
          }

          var testLocal;
          try {
            testLocal = window.localStorage;
            if (testLocal) {
              testLocal.setItem('__storage_test__', '1');
              testLocal.removeItem('__storage_test__');
            } else {
              throw new Error("No localStorage");
            }
          } catch (e) {
            var mockLocal = makeMemoryStorage();
            try {
              Object.defineProperty(window, 'localStorage', {
                get: function() { return mockLocal; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                Object.defineProperty(Window.prototype, 'localStorage', {
                  get: function() { return mockLocal; },
                  configurable: true,
                  enumerable: true
                });
              } catch (err2) {}
            }
          }

          var testSession;
          try {
            testSession = window.sessionStorage;
            if (testSession) {
              testSession.setItem('__session_test__', '1');
              testSession.removeItem('__session_test__');
            } else {
              throw new Error("No sessionStorage");
            }
          } catch (e) {
            var mockSession = makeMemoryStorage();
            try {
              Object.defineProperty(window, 'sessionStorage', {
                get: function() { return mockSession; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                Object.defineProperty(Window.prototype, 'sessionStorage', {
                  get: function() { return mockSession; },
                  configurable: true,
                  enumerable: true
                });
              } catch (err2) {}
            }
          }
        } catch (globalStorageErr) {}
      })();
